<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="form">

        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" width="150">

        <label>Name</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <label>Program</label>
        <select id="program">
            <option value="BS Information Technology">
                BS Information Technology
            </option>
        </select>

        <label>Most Said Line</label>
        <input type="text" id="mostSaidLine" placeholder="Enter your most said line">

        <label>Favorite Song</label>
        <input type="text" id="favoriteSong" placeholder="Enter favorite song">

        <button type="button" onclick="searchSong()">
            Search Song
        </button>

        <div class="spotify-card">

            <img id="albumCover" src="" width="60">

            <div>
                <h3 id="songName"></h3>
                <p id="artist"></p>
            </div>

        </div>

        <input type="button" value="Submit" onclick="onSubmit()">

    </div>

    <script src="form.js"></script>

</body>

</html>
